name = "brevo-optin-api"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://itchronicle.com,https://www.itchronicle.com"
BREVO_TEMPLATE_IT = "11"
BREVO_TEMPLATE_EN = "12"
